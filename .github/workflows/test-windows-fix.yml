name: Test Windows Fix

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app
        run: pnpm tauri build --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Prepare artifacts
        shell: bash
        run: |
          BUNDLE_DIR="./src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version)")"

          # Find and rename installer
          shopt -s nullglob
          INSTALLER_CANDIDATES=(
            "$BUNDLE_DIR/nsis/Json Studio"*"_x64-setup.exe"
            "$BUNDLE_DIR/nsis/Json.Studio"*"_x64-setup.exe"
          )

          PORTABLE_EXE_CANDIDATES=(
            "$BUNDLE_DIR/../jsonstudio.exe"
            "$BUNDLE_DIR/../Json Studio.exe"
            "$BUNDLE_DIR/../Json.Studio.exe"
          )

          RENAMED_INSTALLER="$BUNDLE_DIR/nsis/JsonStudio_${VERSION}_windows_x64-setup.exe"
          PORTABLE_ZIP="$BUNDLE_DIR/JsonStudio_${VERSION}_windows_x64-portable.zip"

          # Rename installer
          if [ ${#INSTALLER_CANDIDATES[@]} -gt 0 ]; then
            ORIGINAL_INSTALLER="${INSTALLER_CANDIDATES[0]}"
            mv "$ORIGINAL_INSTALLER" "$RENAMED_INSTALLER"
            echo "✓ Renamed installer: $RENAMED_INSTALLER"
          else
            echo "❌ Installer not found"
            ls -la "$BUNDLE_DIR/nsis/" || true
            exit 1
          fi

          # Create portable zip
          PORTABLE_EXE=""
          for candidate in "${PORTABLE_EXE_CANDIDATES[@]}"; do
            if [ -f "$candidate" ]; then
              PORTABLE_EXE="$candidate"
              break
            fi
          done

          if [ -n "$PORTABLE_EXE" ]; then
            TEMP_DIR="$(mktemp -d)"
            PORTABLE_ROOT="$TEMP_DIR/JsonStudio"
            mkdir -p "$PORTABLE_ROOT"
            cp "$PORTABLE_EXE" "$PORTABLE_ROOT/JsonStudio.exe"

            PORTABLE_ROOT_WIN="$(cygpath -w "$PORTABLE_ROOT")"
            PORTABLE_ZIP_WIN="$(cygpath -w "$PORTABLE_ZIP")"
            export PORTABLE_ROOT_WIN PORTABLE_ZIP_WIN
            powershell -NoProfile -Command "Compress-Archive -Path \$env:PORTABLE_ROOT_WIN -DestinationPath \$env:PORTABLE_ZIP_WIN -Force"
            rm -rf "$TEMP_DIR"

            echo "✓ Created portable zip: $PORTABLE_ZIP"
          else
            echo "❌ Portable exe not found"
            ls -la "$BUNDLE_DIR/../" || true
            exit 1
          fi

          # List final artifacts
          echo ""
          echo "=== Build artifacts ready ==="
          ls -lh "$RENAMED_INSTALLER"
          ls -lh "$PORTABLE_ZIP"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v3
        with:
          name: windows-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

      - name: Upload Windows portable
        uses: actions/upload-artifact@v3
        with:
          name: windows-portable
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/*.zip
